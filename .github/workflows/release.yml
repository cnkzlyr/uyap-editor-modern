name: Build and Release UYAP Editor Modern

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Sürüm etiketi (ör. v2.2.0); boşsa yalnızca derlenir'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Modernizer Agent JAR
        run: |
          chmod +x tools/build-agent.sh
          ./tools/build-agent.sh

      - name: Paketle (Java 14.0.2 + e-imza ajanı + Windows yazı tipleri)
        run: |
          chmod +x tools/paketle.sh
          ./tools/paketle.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
          name: "UYAP Editör Modern ${{ github.event.inputs.tag || github.ref_name }}"
          body: |
            ### UYAP Editör Modern ${{ github.event.inputs.tag || github.ref_name }} Yenilikleri
            * **Java 14.0.2 paketin içinde (Linux, Windows, macOS):** resmi OpenJDK 14.0.2, jlink ile küçültülmüş — ayrıca Java indirmeye gerek yok.
            * **Windows yazı tipleri (Linux & macOS):** Times New Roman, Arial, Courier New, Georgia, Verdana… Microsoft'un orijinal Core Fonts kurulum dosyalarından kurulumda açılır; belge ve PDF Windows'takiyle aynı görünür.
            * **E-imza:** Windows'ta Türkçe adlı okuyucular (ArkSigner) için Unicode PC/SC ajanı; AKİS kartlar editörün APDU kipiyle sürücüsüz imzalanır (Araçlar menüsü).
            * **Düzeltme:** ajan artık Java 14 uyumlu derlenir (v2.1.0'daki jar Java 17 sınıf sürümüyle derlenmişti).
            * **Android (YENİ):** Termux/X11'siz bağımsız UYAP Editör — https://github.com/cnkzlyr/udemobile/releases (UYAP-Editor-vX.apk).
            * **120Hz & 240Hz Akıcı Kaydırma (Smooth Scrolling):** Donanım ekran yenileme hızına duyarlı momentum kaydırma (`F9`).
            * **Tam E-İmza & PKCS#11 Uyumluluğu:** Arkİmza (NES ECC) ve TBB Kırmızı Token (ACS ACR39U / TÜRKTRUST) otomatik algılama ve imzalama desteği.
            * **Modern FlatLaf Arayüz Temaları:** Modern Açık, Koyu ve Sistem temaları.
            * **Çoklu Platform:** Linux (Fedora/Ubuntu/Pardus/Arch), Windows 10/11, macOS (Intel & Apple Silicon) ve Android (Termux-X11) desteği.

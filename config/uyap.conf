# UYAP Editör Gelişmiş Performans ve Görüntü Yapılandırması
# ~/.uki/uyap.conf

# UI Ölçeklendirme (HiDPI Scaling):
# Otomatik algılama için 'auto', 1080p için '1.0', 2K için '1.25' veya '1.5', 4K için '2.0'
UYAP_SCALE=auto

# Bellek Ayarları:
UYAP_XMS=256m
UYAP_XMX=1024m

# Akıcı Kaydırma (Word / Edge stili 120Hz Smooth Scroll): 1 = Açık, 0 = Kapalı
UYAP_SMOOTH_SCROLL=1

# Sistem Dosya Seçici: 0 = Kapalı (UYAP Özgün Seçici), 1 = Açık
UYAP_NATIVE_FILECHOOSER=0
